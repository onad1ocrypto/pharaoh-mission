  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:#0b0714;overflow:hidden;
    font-family:"Trebuchet MS",Verdana,Geneva,sans-serif;color:#f6e7c8}
  body{background:radial-gradient(circle at 50% 20%,#241436 0%,#0b0714 70%)}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
  canvas{display:block;background:#120a20;border-radius:8px;touch-action:none;
    box-shadow:0 0 0 2px rgba(245,197,66,.35),0 0 40px rgba(245,197,66,.10),0 24px 70px rgba(0,0,0,.7)}
  #touch{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
  #touch .pad{display:flex;gap:14px;pointer-events:auto}
  .btn{width:78px;height:78px;border-radius:50%;background:rgba(245,197,66,.14);
    border:2px solid rgba(245,197,66,.5);color:#f5c542;font-size:30px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  .btn.press{background:rgba(245,197,66,.42);transform:scale(.94)}
  #hint{position:fixed;left:0;right:0;bottom:4px;text-align:center;font-size:11px;opacity:.4;letter-spacing:.3px}
  #namebox{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(8,3,14,.85);z-index:9}
  .nb-card{background:#1c0f26;border:3px solid #f5c542;border-radius:16px;padding:26px 34px;
    text-align:center;box-shadow:0 0 60px rgba(232,65,66,.35)}
  .nb-title{font-family:'PharaohDisplay',serif;font-size:30px;color:#ffd976;letter-spacing:2px}
  .nb-sub{font-size:13px;color:#f6e7c8;margin:8px 0 16px;opacity:.85}
  #nb-input{display:block;width:270px;margin:0 auto 14px;padding:10px 14px;font-size:18px;
    text-align:center;letter-spacing:2px;text-transform:uppercase;color:#ffd976;
    background:#0d0612;border:2px solid #e84142;border-radius:10px;outline:none}
  #nb-input:focus{border-color:#ffd976}
  #nb-btn{font-family:'PharaohDisplay',serif;font-size:17px;color:#fff;background:#e84142;
    border:2px solid #ffd976;border-radius:10px;padding:10px 26px;cursor:pointer}
  #nb-btn:hover{background:#ff6b5e}
  #nb-err{height:18px;margin-top:8px;font-size:12px;color:#ff6b5e}
  @media (max-width:760px){#hint{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="560"></canvas></div>
<div id="namebox" style="display:none">
  <div class="nb-card">
    <div class="nb-title">ENTER YOUR NAME</div>
    <div class="nb-sub">Your permanent tag on the global leaderboard</div>
    <input id="nb-input" maxlength="16" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
    <button id="nb-btn">START QUEST ▶</button>
    <div id="nb-err"></div>
  </div>
</div>
<div id="touch">
  <div class="pad">
    <div class="btn" data-k="left">◀</div>
    <div class="btn" data-k="right">▶</div>
  </div>
  <div class="pad">
    <div class="btn" data-k="defend">🛡</div>
    <div class="btn" data-k="attack">⚡</div>
    <div class="btn" data-k="jump">▲</div>
  </div>
</div>
<div id="hint">&larr; &rarr; / A D = move &nbsp;·&nbsp; SPACE = jump &nbsp;·&nbsp; J / X = attack &nbsp;·&nbsp; K / C = defend &nbsp;·&nbsp; P = pause &nbsp;·&nbsp; M = music &nbsp;·&nbsp; R = retry</div>
<script>
/* =========================================================
   PHARAOH QUEST — core: konstanta, aset, input, audio
   ========================================================= */
'use strict';

var CV  = document.getElementById('game');

/* ---------- util ---------- */
function rnd(i){ var x = Math.sin(i * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); }
function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }
function lerp(a,b,t){ return a + (b - a) * t; }
function aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }

/* ---------- layar ---------- */
var IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (IS_TOUCH) document.getElementById('touch').style.display = 'flex';

function fitCanvas(){
  var pad = IS_TOUCH ? 130 : 24;
  var s = Math.min(window.innerWidth / VW, (window.innerHeight - pad) / VH);
  s = Math.max(0.25, s);
  CV.style.width  = Math.floor(VW * s) + 'px';
  CV.style.height = Math.floor(VH * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
fitCanvas();

/* ---------- input ---------- */
var keys    = { left:false, right:false, jump:false, duck:false };
var pressed = {};
var CODEMAP = { ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
                Space:'jump', ArrowUp:'jump', KeyW:'jump', ArrowDown:'duck', KeyS:'duck',
                KeyJ:'attack', KeyX:'attack', KeyK:'defend', KeyC:'defend' };

window.addEventListener('keydown', function(e){
  SFX.unlock();
  var a = CODEMAP[e.code];
  if (a){ if(!keys[a]) pressed[a] = true; keys[a] = true; e.preventDefault(); }
  switch(e.code){
    case 'Enter': case 'NumpadEnter': pressed.enter = true; e.preventDefault(); break;
    case 'Escape': pressed.esc = true; break;
    case 'KeyP': pressed.p = true; break;
    case 'KeyM': pressed.m = true; break;
    case 'KeyR': pressed.r = true; break;
    case 'KeyC': pressed.c = true; break;
    case 'KeyL': pressed.l = true; break;
  }
});
window.addEventListener('keyup', function(e){
  var a = CODEMAP[e.code];
  if (a){ keys[a] = false; e.preventDefault(); }
});
window.addEventListener('blur', function(){ for (var k in keys) keys[k] = false; });

/* tombol layar (HP) */
var btns = document.querySelectorAll('.btn');
for (var i = 0; i < btns.length; i++){
  (function(b){
    var k = b.getAttribute('data-k');
    function on(ev){ ev.preventDefault(); SFX.unlock(); if(!keys[k]) pressed[k] = true; keys[k] = true; b.classList.add('press'); }
    function off(ev){ ev.preventDefault(); keys[k] = false; b.classList.remove('press'); }
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('pointerleave', off);
  })(btns[i]);
}
CV.addEventListener('pointerdown', function(e){
  SFX.unlock();
  var r = CV.getBoundingClientRect();
  canvasClick((e.clientX - r.left) * VW / r.width, (e.clientY - r.top) * VH / r.height);
});

/* ---------- leaderboard: username permanen + kirim skor ---------- */
var NET = {
  user: (function(){ try { return localStorage.getItem('pq_user') || ''; } catch(e){ return ''; } })(),
  setName: function(n){
    n = (n || '').replace(/[^\w ]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
    if (n.length < 3) return false;
    this.user = n;
    try { localStorage.setItem('pq_user', n); } catch(e){}
    return true;
  },
  localGet: function(){ try { return JSON.parse(localStorage.getItem('pq_board') || '[]'); } catch(e){ return []; } },
  localSubmit: function(s){
    var b = this.localGet(), me = null, i;
    for (i = 0; i < b.length; i++) if (b[i].u === this.user) me = b[i];
    if (me) me.s = Math.max(me.s, s); else b.push({ u:this.user, s:s });
    b.sort(function(a, c){ return c.s - a.s; });
    try { localStorage.setItem('pq_board', JSON.stringify(b.slice(0, 50))); } catch(e){}
  },
  submit: function(s){
    if (!this.user || s <= 0) return;
    this.localSubmit(s);
    try {
      fetch('/api/leaderboard', { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ u:this.user, s:s }) }).catch(function(){});
    } catch(e){}
  },
  board: function(cb){
    var self = this;
    var fallback = function(){ cb(self.localGet().slice(0, 10), false); };
    try {
      fetch('/api/leaderboard').then(function(r){
        if (!r.ok) throw 0;
        return r.json();
      }).then(function(j){ cb(j.top || [], true); }).catch(fallback);
    } catch(e){ fallback(); }
  }
};

/* kotak username (DOM, muncul sekali) */
(function(){
  var box = document.getElementById('namebox');
  var inp = document.getElementById('nb-input');
  var err = document.getElementById('nb-err');
  function commit(){
    if (NET.setName(inp.value)){ box.style.display = 'none'; SFX.unlock(); SFX.blip(); }
    else err.textContent = '3-16 letters / numbers only';
  }
  if (NET.user){ box.style.display = 'none'; }
  else {
    box.style.display = 'flex';
    document.getElementById('nb-btn').addEventListener('click', commit);
    inp.addEventListener('keydown', function(e){
      e.stopPropagation();
      if (e.key === 'Enter') commit();
    });
    setTimeout(function(){ inp.focus(); }, 300);
  }
})();

/* ---------- audio (semua di-sintesis, tanpa file luar) ---------- */
var SFX = {
  ac:null, master:null, busSfx:null, busMus:null,
  musicOn:true, sfxOn:true, timer:null, step:0, nextT:0, bpm:104,

  unlock:function(){
    if (!this.ac){
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ac = new AC();
        this.master = this.ac.createGain();  this.master.gain.value = 0.7;
        this.busSfx = this.ac.createGain();  this.busSfx.gain.value = 0.55;
        this.busMus = this.ac.createGain();  this.busMus.gain.value = 0.0;
        this.master.connect(this.ac.destination);
        this.busSfx.connect(this.master);
        this.busMus.connect(this.master);
        this.startMusic();
      } catch(e){ this.ac = null; }
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume();
  },

  tone:function(f, dur, type, vol, slideTo, when, bus){
    if (!this.ac) return;
    if (bus === 'mus' ? !this.musicOn : !this.sfxOn) return;
    var A = this.ac, t = when || A.currentTime;
    var o = A.createOscillator(), g = A.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(24, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus === 'mus' ? this.busMus : this.busSfx);
    o.start(t); o.stop(t + dur + 0.06);
  },

  noise:function(dur, vol, when, hp, bus){
    if (!this.ac || (!this.sfxOn && bus !== 'mus')) return;
    var A = this.ac, t = when || A.currentTime;
    var n = Math.max(1, Math.floor(A.sampleRate * dur));
    var buf = A.createBuffer(1, n, A.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = A.createBufferSource(); s.buffer = buf;
    var f = A.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1500;
    var g = A.createGain(); g.gain.value = vol;

  /* ---------- musik: tangga nada double-harmonic (nuansa Mesir/Timur Tengah) ---------- */
  SCALE:[0,1,4,5,7,8,11],
  deg:function(i){ var o = Math.floor(i / 7), k = ((i % 7) + 7) % 7;
    return 62 + this.SCALE[k] + 12 * o; },
  MEL:[7,null,6,5,null,4,5,null, 4,null,2,1,0,null,null,null,

    if (!this.ac) return;

    while (this.nextT < A.currentTime + 0.25){
      this.playStep(this.step, this.nextT);
      this.nextT += 60 / this.bpm / 4;
      this.step = (this.step + 1) % 32;
    }
  },
  playStep:function(i, t){
    var m = this.MEL[i];
    if (m !== null) this.tone(this.deg(m), 0.24, 'triangle', 0.13, null, t, 'mus');
    var b = this.BASS[i];
    if (b !== null) this.tone(this.deg(b) - 24, 0.34, 'sine', 0.30, null, t, 'mus');

    }
  },

};

/* ---------- bangun level jadi grid + entitas ---------- */
function buildLevel(idx){
  var L  = LEVELS[idx];
  var W  = L.width, grid = [], y, x, i;
  for (y = 0; y < ROWS; y++){ grid.push(new Array(W)); for (x = 0; x < W; x++) grid[y][x] = ' '; }

  /* tanah */
  for (x = 0; x < W; x++) for (y = L.ground; y < ROWS; y++) grid[y][x] = '#';
  /* jurang */
  (L.pits || []).forEach(function(p){ for (x = p[0]; x <= p[1]; x++)
      for (y = L.ground; y < ROWS; y++) grid[y][x] = ' '; });
  /* platform batu bata */
  (L.plat || []).forEach(function(p){ for (i = 0; i < p[2]; i++)
      if (grid[p[1]] && p[0]+i < W) grid[p[1]][p[0]+i] = 'B'; });
  /* blok tanda tanya */
  (L.qb  || []).forEach(function(p){ if (grid[p[1]] && p[0] < W) grid[p[1]][p[0]] = '?'; });
  /* duri */
  (L.spikes || []).forEach(function(p){ for (i = 0; i < p[2]; i++)
      if (grid[p[1]] && p[0]+i < W) grid[p[1]][p[0]+i] = '^'; });

  /* koin */
  var coins = [];
  (L.coins || []).forEach(function(c){
    for (i = 0; i < c[2]; i++)
      coins.push({ x:(c[0]+i)*TILE + TILE/2, y:c[1]*TILE + TILE/2, r:13, got:false, ph:i*0.7 });
  });

  /* harta */
  var ankhs = (L.ankhs || []).map(function(a){ return { x:a[0]*TILE+TILE/2, y:a[1]*TILE+TILE/2, got:false }; });
  var gems  = (L.gems  || []).map(function(a){ return { x:a[0]*TILE+TILE/2, y:a[1]*TILE+TILE/2, got:false }; });

  /* musuh */
  var enemies = (L.enemies || []).map(function(e, n){
    var t = e[0], px = e[1] * TILE + 4, py;
    if (t === 'h'){ /* elang horus: terbang */
      return { type:t, x:px, y:6*TILE, w:38, h:26, vx:(n % 2 ? -1.15 : 1.15), vy:0,
               baseY:6*TILE, ph:n, anim:0, dead:false, deadT:0 };
    }
    var h = t === 'm' ? 50 : (t === 'b' ? 40 : 30);
    py = (L.ground) * TILE - h;
    return { type:t, x:px, y:py, w: t === 'm' ? 32 : (t === 'b' ? 46 : 34), h:h,
             vx:(n % 2 ? -0.85 : 0.85) * (t === 'm' ? 0.75 : (t === 'b' ? 0.62 : 1.15)), vy:0,
             baseY:py, ph:n * 1.3, anim:0, dead:false, deadT:0, ground:true };
  });

  /* platform bergerak */
  var mplats = (L.mplat || []).map(function(m, n){
    return { x:m.x*TILE, y:m.y*TILE, w:m.w*TILE, h:18,
             ox:m.x*TILE, oy:m.y*TILE, axis:m.axis, range:m.range,
             speed:m.speed, ph:n*1.9, dx:0, dy:0 };
  });

  var deco = (L.deco || []).map(function(d){ return { type:d[0], x:d[1], text:d[2] }; });

  return {
    idx:idx, name:L.name, theme:L.theme, width:W, ground:L.ground, grid:grid,
    coins:coins, ankhs:ankhs, gems:gems, enemies:enemies, mplats:mplats, deco:deco,
    flag:L.flag, time:L.time, pxW:W*TILE
  };
}

/* ---------- langit & latar belakang ---------- */
function drawSky(theme, camX, t){
  var P = THEMES[theme], g = CTX.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, P.skyTop); g.addColorStop(1, P.skyBot);
  CTX.fillStyle = g; CTX.fillRect(0, 0, VW, VH);

  if (theme !== 'tomb'){
    /* matahari */
    var sx = VW - 170 - camX * 0.05, sy = 92;
    CTX.fillStyle = P.sunGlow;
    CTX.beginPath(); CTX.arc(sx, sy, 74, 0, 7); CTX.fill();
    CTX.fillStyle = P.sun;
    CTX.beginPath(); CTX.arc(sx, sy, 36, 0, 7); CTX.fill();
  } else {
    /* hieroglif samar di dinding makam */
    CTX.fillStyle = P.glyph;
    var off = (camX * 0.3) % 160;
    for (var gx = -off; gx < VW; gx += 160){
      for (var gy = 40; gy < VH - 120; gy += 120){
        drawGlyphIcon('ankh', gx + 30, gy, 22);
        drawGlyphIcon('eye',  gx + 95, gy + 14, 26);
      }
    }
  }

  /* piramida jauh */
  var f = camX * 0.15, n = 5, i, bx, w = 420;
  CTX.fillStyle = P.far;
  for (i = 0; i < n + 2; i++){
    bx = i * w - (f % w) - w;
    var h2 = 150 + rnd(i + Math.floor(f / w)) * 90;
    CTX.beginPath();
    CTX.moveTo(bx, VH - 100);
    CTX.lineTo(bx + w * 0.5, VH - 100 - h2);
    CTX.lineTo(bx + w, VH - 100);
    CTX.closePath(); CTX.fill();
    CTX.fillStyle = 'rgba(255,255,255,.10)';
    CTX.beginPath();
    CTX.moveTo(bx + w * 0.5, VH - 100 - h2);
    CTX.lineTo(bx + w * 0.78, VH - 100);
    CTX.lineTo(bx + w * 0.5, VH - 100);
    CTX.closePath(); CTX.fill();
    CTX.fillStyle = P.far;
  }

  /* gundukan pasir dekat */
  var f2 = camX * 0.35, w2 = 300;
  CTX.fillStyle = P.dune;
  CTX.beginPath();
  CTX.moveTo(0, VH);
  for (i = -1; i < VW / 60 + 2; i++){
    var xx = i * 60 - (f2 % 60);
    CTX.quadraticCurveTo(xx + 30, VH - 130 - rnd(Math.floor((f2 + xx) / 60)) * 40, xx + 60, VH - 90);
  }
  CTX.lineTo(VW, VH); CTX.closePath(); CTX.fill();
}

/* ---------- ikon hieroglif kecil ---------- */
function drawGlyphIcon(kind, x, y, s){
  CTX.save(); CTX.translate(x, y);
  var u = s / 24;
  CTX.lineWidth = 3 * u; CTX.strokeStyle = CTX.fillStyle;
  if (kind === 'ankh'){
    CTX.beginPath(); CTX.ellipse(0, -8 * u, 5 * u, 7 * u, 0, 0, 7); CTX.stroke();
    CTX.beginPath(); CTX.moveTo(0, -1 * u); CTX.lineTo(0, 12 * u); CTX.stroke();
    CTX.beginPath(); CTX.moveTo(-7 * u, 2 * u); CTX.lineTo(7 * u, 2 * u); CTX.stroke();
  } else if (kind === 'eye'){
    CTX.beginPath(); CTX.moveTo(-10 * u, 0); CTX.quadraticCurveTo(0, -7 * u, 10 * u, 0);
    CTX.quadraticCurveTo(0, 6 * u, -10 * u, 0); CTX.stroke();
    CTX.beginPath(); CTX.arc(0, -1 * u, 3 * u, 0, 7); CTX.fill();
  } else if (kind === 'bird'){
    CTX.beginPath(); CTX.arc(2 * u, -8 * u, 4 * u, 0, 7); CTX.fill();
    CTX.fillRect(-6 * u, -5 * u, 9 * u, 10 * u);
    CTX.fillRect(3 * u, -9 * u, 5 * u, 2 * u);
  } else if (kind === 'zig'){
    CTX.beginPath(); CTX.moveTo(-10 * u, 2 * u);
    for (var i = 0; i < 4; i++) CTX.lineTo(-10 * u + (i * 5 + 2.5) * u, (i % 2 ? 2 : -4) * u);
    CTX.stroke();
  } else { /* sun */
    CTX.beginPath(); CTX.arc(0, 0, 7 * u, 0, 7); CTX.fill();
  }
  CTX.restore();
}

/* ---------- tile ---------- */
function bumpOffset(tx, ty){
  var b = G.bumps[tx + ',' + ty];
  if (!b) return 0;
  return -Math.sin(Math.min(1, (G.t - b) / 12) * Math.PI) * 8;
}

function drawTile(ch, tx, ty){
  var P = THEMES[G.L.theme], x = tx * TILE, y = ty * TILE;
  if (ch === '#'){
    CTX.fillStyle = P.ground; CTX.fillRect(x, y, TILE, TILE);
    CTX.fillStyle = P.groundDark;
    CTX.fillRect(x, y + TILE - 4, TILE, 4);
    CTX.fillRect(x + TILE - 2, y, 2, TILE);
    if (ty === 0 || !solid(tx, ty - 1)){
      CTX.fillStyle = P.groundTop; CTX.fillRect(x, y, TILE, 7);
      CTX.fillStyle = P.glyph;
      drawGlyphIcon(GLYPHS[(tx * 7 + ty * 3) % 5], x + 20, y + 24, 16);
    }
    CTX.strokeStyle = P.groundDark; CTX.lineWidth = 1;
    CTX.beginPath(); CTX.moveTo(x, y + 20); CTX.lineTo(x + TILE, y + 20); CTX.stroke();
  } else if (ch === 'B'){
    CTX.fillStyle = P.brick; CTX.fillRect(x, y, TILE, TILE);
    CTX.strokeStyle = P.brickDark; CTX.lineWidth = 2;
    CTX.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
    CTX.beginPath();
    CTX.moveTo(x, y + 13); CTX.lineTo(x + TILE, y + 13);
    CTX.moveTo(x, y + 26); CTX.lineTo(x + TILE, y + 26);
    CTX.moveTo(x + 20, y); CTX.lineTo(x + 20, y + 13);
    CTX.moveTo(x + 10, y + 13); CTX.lineTo(x + 10, y + 26);
    CTX.moveTo(x + 30, y + 13); CTX.lineTo(x + 30, y + 26);
    CTX.moveTo(x + 20, y + 26); CTX.lineTo(x + 20, y + 40);
    CTX.stroke();
  } else if (ch === '?' || ch === 'U'){
    var off = bumpOffset(tx, ty);
    y += off;
    CTX.fillStyle = ch === '?' ? P.q : P.used;
    CTX.fillRect(x, y, TILE, TILE);
    CTX.strokeStyle = P.qDark; CTX.lineWidth = 3;
    CTX.strokeRect(x + 1.5, y + 1.5, TILE - 3, TILE - 3);
    CTX.fillStyle = P.qDark;
    [[5,5],[TILE-7,5],[5,TILE-7],[TILE-7,TILE-7]].forEach(function(c){
      CTX.fillRect(x + c[0], y + c[1], 3, 3);
    });
    if (ch === '?'){
      CTX.fillStyle = P.qDark;
      CTX.font = 'bold 24px "Trebuchet MS",sans-serif';
      CTX.textAlign = 'center'; CTX.textBaseline = 'middle';
      CTX.fillText('?', x + TILE/2, y + TILE/2 + 2 + Math.sin(G.t * 0.1 + tx) * 1.5);
    }
  } else if (ch === '^'){
    CTX.fillStyle = '#cfd2d6'; CTX.strokeStyle = '#5b5f66'; CTX.lineWidth = 2;
    for (var i = 0; i < 3; i++){
      var sx = x + i * 14;
      CTX.beginPath();
      CTX.moveTo(sx + 1, y + TILE);
      CTX.lineTo(sx + 7, y + 8);
      CTX.lineTo(sx + 13, y + TILE);
      CTX.closePath(); CTX.fill(); CTX.stroke();
    }
  }
}

/* ---------- dekorasi dunia ---------- */
function drawDeco(d){
  var x = d.x * TILE, gy = G.L.ground * TILE, t = G.t;
  CTX.save();
  if (d.type === 'palm'){

      CTX.quadraticCurveTo(x + 4 + Math.cos(a) * 34, gy - 120 + Math.sin(a) * 26 - 10,

/* Indeks adegan: 0 diam, 1 lari, 2 serang, 3 bertahan, 4 super, 5 terkena */
function drawPlayer(){
  var P = G.P;
  if (P.invincibleT > 0 && (G.t % 8 < 4) && !G.dying && P.hurtT <= 0) return;

  /* bayangan */
  CTX.fillStyle = 'rgba(0,0,0,.25)';
  CTX.beginPath(); CTX.ellipse(P.x + P.w / 2, P.groundY, 20, 6, 0, 0, 7); CTX.fill();

  var idx;
  if (G.dying || P.hurtT > 0)            idx = 5; /* terkena */
  else if (P.defending)                  idx = 3; /* bertahan */
  else if (P.attackT > 0)                idx = 2; /* serang */
  else if (P.powerT > 0)                 idx = 4; /* super */
  else if (!P.grounded || Math.abs(P.vx) > 0.5) idx = 1; /* lari */
  else                                   idx = 0; /* diam */

  /* aura kekuatan ankh (mode super) */
  if (P.powerT > 0){
    var r = 48 + Math.sin(G.t * 0.2) * 6;
    var g = CTX.createRadialGradient(P.x + P.w/2, P.y + P.h/2, 8, P.x + P.w/2, P.y + P.h/2, r);
    g.addColorStop(0, 'rgba(255,120,60,.45)');
    g.addColorStop(1, 'rgba(255,120,60,0)');
    CTX.fillStyle = g;
    CTX.beginPath(); CTX.arc(P.x + P.w/2, P.y + P.h/2, r, 0, 7); CTX.fill();
    if (P.powerT < 120 && G.t % 10 < 5) return; /* berkedip mau habis */
  }

  var img = charImgs[idx];
  CTX.save();
  CTX.translate(P.x + P.w / 2, P.y + P.h);
  CTX.scale(P.face < 0 ? -1 : 1, 1);
  if (!P.grounded) CTX.rotate(P.face * -0.06);
  var h = P.h + 2, w = h * img.width / img.height;
  w = Math.min(w, 96);
  CTX.drawImage(img, -w / 2, -h, w, h);
  CTX.restore();
}

/* =========================================================
   PHARAOH QUEST — state game, fisika, logika entitas
   ========================================================= */

var G = {
  screen:'title', L:null, levelIdx:0,
  P:null, camX:0, t:0,
  score:0, coins:0, lives:3, timeLeft:0,
  best:0, sel:0, charIdx:0,
  paused:false, dying:false, dieT:0,
  done:false, doneT:0, timeBonus:0,
  fx:[], bumps:{}
};
try { G.best = parseInt(localStorage.getItem('pharaohquest_best') || '0', 10) || 0; } catch(e){}

var GRAV = 0.55, ACC = 0.55, MAXVX = 4.3, JUMPV = 12.9, MAXFALL = 13.5;

function newPlayer(){
  return { x:2*TILE, y:(G.L.ground)*TILE - 64, w:30, h:62, vx:0, vy:0,
           face:1, grounded:true, coyote:7, jbuf:0, invincibleT:0, powerT:0,
           groundY:(G.L.ground)*TILE, ride:null, prevBottom:0,
           attackT:0, atkCd:0, defending:false, hurtT:0, jumps:0 };
}

function loadLevel(i){
  G.levelIdx = i;
  G.L = buildLevel(i);
  G.P = newPlayer();
  G.camX = 0; G.timeLeft = G.L.time;
  G.fx = []; G.bumps = {}; G.shots = [];
  G.done = false; G.doneT = 0; G.timeBonus = 0;
  G.dying = false; G.dieT = 0; G.paused = false;
  G.bird = { on:false }; G.birdT = 420;
}

function startGame(){
  G.score = 0; G.coins = 0; G.lives = 3; G.submitted = false;
  loadLevel(0);
  G.screen = 'play';
  SFX.unlock(); SFX.setMusic(SFX.musicOn);
}

function saveBest(){
  if (G.score > G.best){ G.best = G.score;
    try { localStorage.setItem('pharaohquest_best', String(G.best)); } catch(e){} }
}

/* ---------- tile helpers ---------- */
function tileAt(tx, ty){
  if (tx < 0 || tx >= G.L.width) return '#';
  if (ty < 0 || ty >= ROWS) return ' ';
  return G.L.grid[ty][tx];
}
function solid(tx, ty){
  var c = tileAt(tx, ty);
  return c === '#' || c === 'B' || c === '?' || c === 'U';
}

function addPop(x, y, txt, color, size){
  G.fx.push({ x:x, y:y, txt:txt, t:0, life:55, color:color || '#ffd976', size:size || 16 });
}

/* ---------- kematian & respawn ---------- */
function startDie(){
  if (G.dying) return;
  G.dying = true; G.dieT = 0;
  G.P.vy = -11; G.P.vx = 0;
  SFX.die();
}
function loseLife(){
  G.lives--;
  if (G.lives <= 0){
    saveBest();
    G.screen = 'over';
    SFX.sad();
  } else {
    respawn();
  }
}
function respawn(){
  G.P = newPlayer();
  G.camX = 0;
  G.timeLeft = G.L.time;
  G.dying = false; G.dieT = 0;
  G.P.invincibleT = 100;
}

/* ---------- pemain ---------- */
function hitFromBelow(tx, ty){
  var c = tileAt(tx, ty);
  if (c === '?'){
    G.L.grid[ty][tx] = 'U';
    G.bumps[tx + ',' + ty] = G.t;
    G.coins++; G.score += 50;
    addPop(tx*TILE + 20, ty*TILE - 8, '+50', '#ffd976', 18);
    SFX.coin();
  } else if (c === 'B' || c === '#'){
    G.bumps[tx + ',' + ty] = G.t;
    SFX.bump();
  }
}

function takeHit(srcX){
  var P = G.P;
  if (P.invincibleT > 0 || G.dying || G.done) return;
  if (P.powerT > 0) return;
  G.lives--;
  P.hurtT = 40;
  addPop(P.x + P.w/2, P.y - 8, 'OUCH!', '#ff6b5e', 18);
  SFX.hurt();
  if (G.lives <= 0){ startDie(); return; }
  P.invincibleT = 110;
  P.vy = -7;
  P.vx = (P.x + P.w/2 < srcX ? -4 : 4);
}

function updatePlayer(){
  var P = G.P, L = G.L, i, m;

  if (G.done){ /* jalan kemenangan ke kanan */
    G.doneT++;
    P.vx = 1.6; P.vy += GRAV;
    P.x += P.vx; P.y = Math.min(P.y + P.vy, L.ground*TILE - P.h);
    if (P.y >= L.ground*TILE - P.h) P.vy = 0;
    P.face = 1;
    if (G.doneT > 150){
      if (G.levelIdx + 1 >= LEVELS.length){
        saveBest();
        G.screen = 'complete';
        SFX.fanfare();
      } else {
        loadLevel(G.levelIdx + 1);
      }
    }
    return;
  }

  if (G.dying){
    G.dieT++;
    P.vy += GRAV * 0.9;
    P.y += P.vy;
    if (G.dieT > 110) loseLife();
    return;
  }

  if (P.invincibleT > 0) P.invincibleT--;
  if (P.powerT > 0) P.powerT--;
  if (P.hurtT > 0) P.hurtT--;
  if (P.attackT > 0) P.attackT--;
  if (P.atkCd > 0) P.atkCd--;

  /* bertahan: angkat perisai energi (diam di tempat) */
  P.defending = keys.defend && P.grounded && !G.done && !G.dying && P.attackT <= 0;

  /* serang: tembakan energi */
  if (pressed.attack && P.atkCd <= 0 && !P.defending && !G.done && !G.dying){
    P.attackT = 16; P.atkCd = 26;
    var sup = P.powerT > 0;
    G.shots.push({ x: P.x + (P.face > 0 ? P.w + 8 : -8), y: P.y + P.h * 0.42,
                   vx: P.face * (sup ? 11 : 9), r: sup ? 13 : 9, sup: sup, t: 0 });
    SFX.shot();
  }

  /* input */
  var ax = 0;
  if (!P.defending){
    if (keys.left)  { ax -= ACC; P.face = -1; }
    if (keys.right) { ax += ACC; P.face =  1; }
  }
  P.vx += ax;
  if (!ax || P.defending) P.vx *= P.grounded ? 0.78 : 0.94;
  P.vx = clamp(P.vx, -MAXVX, MAXVX);
  if (Math.abs(P.vx) < 0.05) P.vx = 0;

  /* lompat: coyote + buffer + lompat variabel + double jump */
  if (pressed.jump) P.jbuf = 7; else if (P.jbuf > 0) P.jbuf--;
  if (P.grounded){ P.coyote = 7; P.jumps = 0; } else if (P.coyote > 0) P.coyote--;
  if (P.jbuf > 0){
    if (P.coyote > 0){
      P.vy = -JUMPV; P.jbuf = 0; P.coyote = 0;
      P.grounded = false; P.ride = null; P.jumps = 1;
      SFX.jump();
    } else if (P.jumps < 2){
      P.vy = -10.6; P.jbuf = 0; P.jumps = 2; /* ketuk 2x = lompat lebih tinggi */
      SFX.jump();
    }
  }
  if (!keys.jump && P.vy < -4.5) P.vy = -4.5;

  P.vy += GRAV;
  P.vy = Math.min(P.vy, MAXFALL);

  /* ikut platform bergerak */
  if (P.ride){
    P.x += P.ride.dx;
    P.y += P.ride.dy;
  }

  /* ---- gerak horizontal ---- */
  P.x += P.vx;
  var top = Math.floor(P.y / TILE), bot = Math.floor((P.y + P.h - 1) / TILE);
  if (P.vx > 0){
    var tx = Math.floor((P.x + P.w) / TILE);
    for (i = top; i <= bot; i++) if (solid(tx, i)){
      if (tileAt(tx, i) === '?') hitFromBelow(tx, i);
      P.x = tx*TILE - P.w - 0.01; P.vx = 0; break; }
  } else if (P.vx < 0){
    var tx2 = Math.floor(P.x / TILE);
    for (i = top; i <= bot; i++) if (solid(tx2, i)){
      if (tileAt(tx2, i) === '?') hitFromBelow(tx2, i);
      P.x = (tx2+1)*TILE + 0.01; P.vx = 0; break; }
  }
  P.x = clamp(P.x, 0, L.pxW - P.w);

  /* ---- gerak vertikal ---- */
  P.prevBottom = P.y + P.h;
  P.y += P.vy;
  P.grounded = false; P.ride = null;
  var lx = Math.floor((P.x + 2) / TILE), rx = Math.floor((P.x + P.w - 2) / TILE);

  if (P.vy >= 0){
    var ty = Math.floor((P.y + P.h) / TILE);
    for (i = lx; i <= rx; i++) if (solid(i, ty)){
      P.y = ty*TILE - P.h - 0.01; P.vy = 0; P.grounded = true; break;
    }
    /* platform satu arah */
    if (!P.grounded) for (i = 0; i < L.mplats.length; i++){
      m = L.mplats[i];
      if (P.x + P.w - 4 > m.x && P.x + 4 < m.x + m.w &&
          P.y + P.h >= m.y && P.prevBottom <= m.y + 6){
        P.y = m.y - P.h; P.vy = 0; P.grounded = true; P.ride = m; break;
      }
    }
  } else {
    var ty2 = Math.floor(P.y / TILE);
    for (i = lx; i <= rx; i++) if (solid(i, ty2)){
      P.y = (ty2+1)*TILE + 0.01; P.vy = 0.5;
      hitFromBelow(i, ty2);
      break;
    }
  }

  /* bayangan: cari tanah di bawah */
  var sy = Math.floor((P.y + P.h) / TILE) + 1;
  P.groundY = P.y + P.h;
  for (i = sy; i < ROWS; i++){
    if (solid(Math.floor((P.x + P.w/2) / TILE), i)){ P.groundY = i*TILE; break; }
    P.groundY = VH;
  }

  /* duri */
  var fy = Math.floor((P.y + P.h - 4) / TILE);
  for (i = lx; i <= rx; i++) if (tileAt(i, fy) === '^'){ takeHit(i*TILE + 20); break; }

  /* jatuh ke jurang */
  if (P.y > ROWS*TILE + 40){
    G.lives--;
    if (G.lives <= 0){ saveBest(); G.screen = 'over'; SFX.sad(); }
    else { SFX.die(); respawn(); }
    return;
  }

  /* ---- koin & harta ---- */
  var px = P.x + P.w/2, py = P.y + P.h/2;
  L.coins.forEach(function(c){
    if (!c.got && Math.abs(c.x - px) < 26 && Math.abs(c.y - py) < 40){
      c.got = true; G.coins++; G.score += 50;
      addPop(c.x, c.y - 12, '+50');
      SFX.coin();
      if (G.coins % 20 === 0){ G.lives++; addPop(px, P.y - 16, '1-UP!', '#7dff9a', 20); SFX.power(); }
    }
  });
  L.ankhs.forEach(function(a){
    if (!a.got && Math.abs(a.x - px) < 30 && Math.abs(a.y - py) < 44){
      a.got = true; P.powerT = 420; G.score += 250;
      addPop(a.x, a.y - 16, 'xPHAR MODE!', '#ffd976', 20);
      SFX.power();
    }
  });
  L.gems.forEach(function(a){
    if (!a.got && Math.abs(a.x - px) < 28 && Math.abs(a.y - py) < 42){
      a.got = true; G.score += 200;
      addPop(a.x, a.y - 14, '+1 AVAX!', '#ff8a8b', 18);
      SFX.coin();
    }
  });

  /* ---- bendera finish ---- */
  if (P.x + P.w > L.flag*TILE && !G.done){
    G.done = true; G.doneT = 0;
    G.timeBonus = Math.max(0, Math.ceil(G.timeLeft)) * 5;
    G.score += 1000 + G.timeBonus;
    addPop(P.x, P.y - 20, '+' + (1000 + G.timeBonus), '#7dff9a', 22);
    SFX.fanfare();
  }
}

/* ---------- platform bergerak ---------- */
function updateMplats(){
  G.L.mplats.forEach(function(m){
    var p = Math.sin(G.t * 0.02 * m.speed * 2 + m.ph);
    var nx = m.ox + (m.axis === 'h' ? (p * 0.5 + 0.5) * m.range : 0);
    var ny = m.oy + (m.axis === 'v' ? (p * 0.5 + 0.5) * m.range : 0);
    m.dx = nx - m.x; m.dy = ny - m.y;
    m.x = nx; m.y = ny;
  });
}

/* ---------- musuh ---------- */
function updateEnemies(){
  var L = G.L, P = G.P, i;
  L.enemies.forEach(function(e){
    if (e.gone) return;
    if (e.dead){ e.deadT++; if (e.deadT > 34) e.gone = true; return; }
    e.anim++;
    if (e.bounceT > 0) e.bounceT--;

    if (e.type === 'h'){
      e.x += e.vx;
      e.y = e.baseY + Math.sin(G.t * 0.03 + e.ph) * 50;
      if (e.x < TILE || e.x > L.pxW - TILE - e.w) e.vx *= -1;
    } else {
      e.vy = (e.vy || 0) + GRAV;
      if (e.ground){ /* jangan masuk jurang: berbalik di tepi */
        var dirx = e.vx > 0 ? 1 : -1;
        var fx2 = Math.floor((e.x + (dirx > 0 ? e.w + 3 : -3)) / TILE);
        var by2 = Math.floor((e.y + e.h + 8) / TILE);
        if (!solid(fx2, by2)) e.vx *= -1;
      }
      e.x += e.vx;
      var top = Math.floor(e.y / TILE), bot = Math.floor((e.y + e.h - 1) / TILE);
      if (e.vx > 0){
        var tx = Math.floor((e.x + e.w) / TILE);
        for (i = top; i <= bot; i++) if (solid(tx, i)){ e.x = tx*TILE - e.w; e.vx *= -1; break; }
      } else {
        var tx2 = Math.floor(e.x / TILE);
        for (i = top; i <= bot; i++) if (solid(tx2, i)){ e.x = (tx2+1)*TILE; e.vx *= -1; break; }
      }
      e.y += e.vy;
      e.ground = false;
      var ty = Math.floor((e.y + e.h) / TILE);
      var lx = Math.floor((e.x + 3) / TILE), rx = Math.floor((e.x + e.w - 3) / TILE);
      for (i = lx; i <= rx; i++) if (solid(i, ty)){ e.y = ty*TILE - e.h; e.vy = 0; e.ground = true; break; }
      if (e.y > ROWS*TILE + 80){ e.gone = true; return; }
    }

    /* tabrakan dengan pemain */
    if (G.dying || G.done) return;
    if (P.x < e.x + e.w && P.x + P.w > e.x && P.y < e.y + e.h && P.y + P.h > e.y){
      if (P.defending){
        if (!e.bounceT){
          e.vx = (e.x + e.w/2 < P.x + P.w/2 ? -1 : 1) * Math.max(1.3, Math.abs(e.vx));
          e.bounceT = 30;
          addPop(P.x + P.w/2, P.y - 6, 'BLOCKED!', '#9fe8ff', 15);
          SFX.shieldS();
        }
        return;
      }
      if (P.powerT > 0){
        e.dead = true; e.deadT = 0; G.score += 150;
        addPop(e.x + e.w/2, e.y - 8, '+150', '#ffd976', 16);
        SFX.stomp();
      } else if (P.vy > 1 && P.prevBottom <= e.y + 12 && e.type !== 'b'){
        e.dead = true; e.deadT = 0; G.score += 100;
        addPop(e.x + e.w/2, e.y - 8, '+100', '#ffffff', 16);
        P.vy = keys.jump ? -10.5 : -7.5;
        P.y = e.y - P.h - 1;
        SFX.stomp();
      } else {
        takeHit(e.x + e.w/2);
      }
    }
  });
}

/* ---------- tembakan energi ---------- */
function updateShots(){
  var L = G.L;
  for (var i = G.shots.length - 1; i >= 0; i--){
    var s = G.shots[i];
    s.t++; s.x += s.vx;
    if (solid(Math.floor(s.x / TILE), Math.floor(s.y / TILE))){
      addPop(s.x, s.y, '✦', '#9fe8ff', 14);
      G.shots.splice(i, 1);
      SFX.bump();
      continue;
    }
    if (s.t > 110 || s.x < G.camX - 120 || s.x > G.camX + VW + 120){
      G.shots.splice(i, 1);
      continue;
    }
    for (var j = 0; j < L.enemies.length; j++){
      var e = L.enemies[j];
      if (e.dead || e.gone) continue;
      if (s.x + s.r > e.x && s.x - s.r < e.x + e.w &&
          s.y + s.r > e.y && s.y - s.r < e.y + e.h){
        e.dead = true; e.deadT = 0; G.score += 100;
        addPop(e.x + e.w/2, e.y - 8, '+100', '#ffffff', 16);
        SFX.stomp();
        if (!s.sup) G.shots.splice(i, 1);
        break;
      }
    }
  }
}

/* ---------- satu langkah update saat bermain ---------- */
function updatePlay(){
  if (pressed.p){ G.paused = !G.paused; SFX.blip(); }
  if (pressed.m){ var on = SFX.toggleMusic(); addPopCenter(on ? 'MUSIC: ON' : 'MUSIC: OFF'); }
  if (pressed.r && !G.done){ loadLevel(G.levelIdx); }
  if (G.paused){ clearPressed(); return; }

  G.t++;
  /* burung lewat bawa kain PHARAOH.GG */
  if (G.bird.on){
    G.bird.t++; G.bird.x += G.bird.vx;
    G.bird.y += Math.sin(G.bird.t * 0.05) * 0.4;
    if (G.bird.x < -200 || G.bird.x > G.L.pxW + 200) G.bird.on = false;
  } else if (--G.birdT <= 0){
    var dir = Math.random() < 0.5 ? 1 : -1;
    G.bird = { on:true, t:0, vx:dir * 2.4,
               x: dir > 0 ? G.camX - 160 : G.camX + VW + 160,
               y: 70 + Math.random() * 90 };
    G.birdT = 700 + Math.random() * 700;
  }
  updateMplats();
  updatePlayer();
  updateEnemies();
  updateShots();

  /* efek melayang */
  for (var i = G.fx.length - 1; i >= 0; i--){
    var f = G.fx[i];
    f.t++; f.y -= 0.9;
    if (f.t > f.life) G.fx.splice(i, 1);
  }

  /* waktu */
  if (!G.done && !G.dying){
    G.timeLeft -= 1/60;
    if (G.timeLeft <= 0){
      G.timeLeft = 0;
      G.lives--;
      if (G.lives <= 0){ saveBest(); G.screen = 'over'; SFX.sad(); }
      else startDie();
    }
  }

  /* kamera */
  var target = clamp(G.P.x + G.P.w/2 - VW*0.40 + G.P.face*50, 0, G.L.pxW - VW);
  G.camX = lerp(G.camX, target, 0.12);

  clearPressed();
}

var DISPLAY_FONT = "'PharaohDisplay','Cinzel Decorative','Papyrus','Trebuchet MS',serif";
function shadowTxt(s, x, y, size, color, align){
  CTX.save();
  CTX.shadowColor = 'rgba(25,8,4,.95)'; CTX.shadowBlur = 5; CTX.shadowOffsetY = 2;
  txt(s, x, y, size, color, align || 'center');
  CTX.restore();
}
function txt(s, x, y, size, color, align, bold){
  CTX.fillStyle = color || '#f6e7c8';
  CTX.font = (bold === false ? '' : 'bold ') + size + 'px "Trebuchet MS",Verdana,sans-serif';
  CTX.textAlign = align || 'left';
  CTX.textBaseline = 'middle';
  CTX.fillText(s, x, y);
}
function outlined(s, x, y, size, color, stroke, align){
  CTX.font = 'bold ' + size + 'px ' + DISPLAY_FONT;
  CTX.textAlign = align || 'center'; CTX.textBaseline = 'middle';
  CTX.lineWidth = Math.max(3, size / 8);
  CTX.strokeStyle = stroke || '#3a2408';
  CTX.strokeText(s, x, y);
  CTX.fillStyle = color; CTX.fillText(s, x, y);
}
function rrect(x, y, w, h, r){
  CTX.beginPath();
  CTX.moveTo(x + r, y);
  CTX.arcTo(x + w, y, x + w, y + h, r);
  CTX.arcTo(x + w, y + h, x, y + h, r);
  CTX.arcTo(x, y + h, x, y, r);
  CTX.arcTo(x, y, x + w, y, r);
  CTX.closePath();
}
function panel(x, y, w, h, alpha){
  CTX.fillStyle = 'rgba(20,10,32,' + (alpha || 0.82) + ')';
  rrect(x, y, w, h, 14); CTX.fill();
  CTX.strokeStyle = 'rgba(245,197,66,.7)'; CTX.lineWidth = 3;
  rrect(x, y, w, h, 14); CTX.stroke();
}

var CARD_W = 170, CARD_H = 170, CARD_X0 = 195, CARD_Y = [95, 285], CARD_GAP = 30;
var START_BTN = { x: VW/2 - 110, y: 472, w: 220, h: 48 };
function cardRect(i){
  return { x: CARD_X0 + (i % 3) * (CARD_W + CARD_GAP),
           y: CARD_Y[(i / 3) | 0], w: CARD_W, h: CARD_H };
}

/* ---------- update layar menu ---------- */
function updateMenus(){
  if (G.screen === 'title'){
    if (pressed.l){ openBoard(); clearPressed(); return; }
    if (pressed.enter || pressed.jump){ G.screen = 'intro'; SFX.blip(); clearPressed(); return; }
  } else if (G.screen === 'board'){
    if (pressed.enter || pressed.esc || pressed.jump){ G.screen = 'title'; SFX.blip(); }
  } else if (G.screen === 'intro'){
    if (pressed.enter || pressed.jump){ startGame(); }
    if (pressed.esc){ G.screen = 'title'; }
  } else if (G.screen === 'over'){
    if (pressed.enter || pressed.jump){ startGame(); }
    if (pressed.esc){ G.screen = 'title'; }
  } else if (G.screen === 'complete'){
    if (pressed.enter || pressed.jump || pressed.esc){ G.screen = 'title'; }
  }
  clearPressed();
}

/* ---------- klik / tap ---------- */
function canvasClick(x, y){
  var i, r;
  if (G.screen === 'title'){ G.screen = 'intro'; SFX.blip(); return; }
  if (G.screen === 'intro'){
    if (x >= START_BTN.x && x <= START_BTN.x + START_BTN.w &&
        y >= START_BTN.y && y <= START_BTN.y + START_BTN.h){
      startGame();
    } else {
      SFX.blip();
    }
    return;
  }
  if (G.screen === 'board'){ G.screen = 'title'; return; }
  if (G.screen === 'over'){ startGame(); return; }
  if (G.screen === 'complete'){ G.screen = 'title'; return; }
  if (G.screen === 'play' && G.paused){ G.paused = false; }
}

    rrect(m.x, m.y, m.w, m.h, 6); CTX.fill();
    CTX.fillStyle = '#f6d89a'; CTX.fillRect(m.x + 2, m.y, m.w - 4, 5);
    CTX.strokeStyle = '#8a6534'; CTX.lineWidth = 2;
    rrect(m.x, m.y, m.w, m.h, 6); CTX.stroke();
  });

  /* mural brand di tembok jalan (di atas tile) */
  L.deco.forEach(function(d){
    if (d.type === 'billboard' || d.type === 'logo' || d.type === 'sign') drawDeco(d);
  });

  drawFlag(L.flag * TILE, L.ground * TILE);

  L.coins.forEach(function(c){ if (!c.got) drawCoin(c.x, c.y, G.t, c.ph); });
  L.ankhs.forEach(function(a){ if (!a.got) drawAnkhItem(a.x, a.y, G.t); });
  L.gems.forEach(function(a){ if (!a.got) drawGemItem(a.x, a.y, G.t); });
  L.enemies.forEach(function(e){ if (!e.gone) drawEnemy(e); });
  G.shots.forEach(drawShot);

  drawPlayer();

  CTX.restore();
  drawPops();

  /* kegelapan makam + cahaya obor */
  if (L.theme === 'tomb'){
    var px = G.P.x + G.P.w/2 - cam, py = G.P.y + G.P.h/2;
    var g = CTX.createRadialGradient(px, py, 70, px, py, 360);
    g.addColorStop(0, 'rgba(8,2,14,0)');
    g.addColorStop(1, 'rgba(8,2,14,.80)');
    CTX.fillStyle = g; CTX.fillRect(0, 0, VW, VH);
    L.deco.forEach(function(d){
      if (d.type !== 'torch') return;
      var x = d.x * TILE - cam, y = G.L.ground * TILE - 108;
      if (x < -60 || x > VW + 60) return;
      var gg = CTX.createRadialGradient(x, y, 4, x, y, 90);
      gg.addColorStop(0, 'rgba(255,160,60,.35)');
      gg.addColorStop(1, 'rgba(255,160,60,0)');
      CTX.fillStyle = gg;
      CTX.beginPath(); CTX.arc(x, y, 90, 0, 7); CTX.fill();
    });
  }
}

/* ---------- overlay saat main ---------- */
function renderPlayOverlays(){
  if (centerPopT > 0){
    centerPopT--;
    CTX.globalAlpha = Math.min(1, centerPopT / 20);
    outlined(centerPopTxt, VW/2, 120, 26, '#ffd976', '#4a2c0a');
    CTX.globalAlpha = 1;
  }

  if (G.done && G.doneT > 25){
    panel(VW/2 - 240, 170, 480, 190);
    outlined('LEVEL ' + (G.levelIdx + 1) + ' COMPLETE!', VW/2, 215, 34, '#ffd976');
    txt('LEVEL BONUS  +1000', VW/2, 262, 19, '#f6e7c8', 'center');
    txt('TIME BONUS  +' + G.timeBonus, VW/2, 292, 19, '#f6e7c8', 'center');
    txt(G.levelIdx + 1 < LEVELS.length ? 'Get ready for the next level…' : '…', VW/2, 330, 15, 'rgba(246,231,200,.8)', 'center');
  }

  if (G.paused){
    CTX.fillStyle = 'rgba(5,2,12,.62)'; CTX.fillRect(0, 0, VW, VH);
    outlined('PAUSED', VW/2, 220, 46, '#ffd976');
    shadowTxt('P = resume · M = music · R = restart level', VW/2, 268, 17, '#fff6e0');
  }
}

/* ---------- leaderboard ---------- */
function openBoard(){
  G.screen = 'board';
  G.boardLoading = true; G.boardData = null;
  NET.board(function(top, online){
    G.boardData = top; G.boardOnline = online; G.boardLoading = false;
  });
}
function renderBoard(){
  drawSky('ruins', G.t * 0.4, G.t);
  CTX.fillStyle = 'rgba(10,5,20,.7)'; CTX.fillRect(0, 0, VW, VH);
  outlined('HALL OF FAME', VW/2, 52, 40, '#ffd976', '#a01820');
  panel(VW/2 - 300, 84, 600, 400);
  if (G.boardLoading){
    outlined('CONNECTING…', VW/2, 280, 24, '#ffe9b0');
  } else {
    var top = G.boardData || [];
    shadowTxt(G.boardOnline ? '★ GLOBAL LEADERBOARD — PHARAOH ON AVAX ★'
                            : 'LOCAL LEADERBOARD (server offline)', VW/2, 108, 14,
              G.boardOnline ? '#ff6b5e' : '#ffe9b0');
    if (!top.length){
      shadowTxt('No scores yet — be the first legend!', VW/2, 280, 18, '#fff6e0');
    }
    for (var i = 0; i < Math.min(10, top.length); i++){
      var y = 140 + i * 32, me = top[i].u === NET.user;
      if (me){ CTX.fillStyle = 'rgba(245,197,66,.16)'; CTX.fillRect(VW/2 - 280, y - 14, 560, 28); }
      var medal = i === 0 ? '#ffd976' : i === 1 ? '#d8d8d8' : i === 2 ? '#d9a05b' : '#f6e7c8';
      txt(String(i + 1).padStart(2, ' '), VW/2 - 260, y, 17, medal, 'left');
      txt(top[i].u, VW/2 - 210, y, 17, me ? '#ffd976' : '#f6e7c8', 'left');
      txt(String(top[i].s).padStart(6, '0'), VW/2 + 260, y, 17, medal, 'right');
    }
    shadowTxt('You play as: ' + (NET.user || '—'), VW/2, 462, 14, '#ff9d97');
  }
  if (G.t % 70 < 45) shadowTxt('ENTER / ESC = BACK', VW/2, 508, 16, '#fff6e0');
}

/* ---------- game over & tamat ---------- */
function renderOver(){
  drawSky('ruins', 0, G.t);
  CTX.fillStyle = 'rgba(10,3,10,.66)'; CTX.fillRect(0, 0, VW, VH);
  outlined('GAME OVER', VW/2, 200, 62, '#ff6b5e', '#3a0d08');
  txt('FINAL SCORE  ' + G.score, VW/2, 268, 24, '#ffd976', 'center');
  txt('BEST SCORE  ' + G.best, VW/2, 300, 17, '#f6e7c8', 'center');
  if (G.t % 70 < 45) outlined('ENTER / TAP = TRY AGAIN', VW/2, 380, 22, '#ffffff', '#4a2c0a');
  shadowTxt('ESC = menu', VW/2, 420, 14, '#ffe9b0');
}

function renderComplete(){
  drawSky('desert', G.t * 0.5, G.t);
  CTX.fillStyle = 'rgba(10,5,20,.35)'; CTX.fillRect(0, 0, VW, VH);
  outlined('QUEST COMPLETE!', VW/2, 130, 52, '#ffd976', '#4a2c0a');
  txt('The royal liquidity is back in the Vault!', VW/2, 190, 18, '#f6e7c8', 'center');
  txt('Pharaoh on AVAX triumphs — 100% of fees to stakers!', VW/2, 216, 18, '#f6e7c8', 'center');

  var im = charImgs[4];
  var h = 200, w = h * im.width / im.height;
  CTX.save();
  CTX.shadowColor = 'rgba(255,217,118,.8)'; CTX.shadowBlur = 30;
  CTX.drawImage(im, VW/2 - w/2, 250, w, h);
  CTX.restore();

  txt('FINAL SCORE  ' + G.score + '   ·   BEST  ' + G.best, VW/2, 480, 20, '#ffd976', 'center');
  if (G.t % 70 < 45) outlined('ENTER / TAP = MENU', VW/2, 520, 20, '#ffffff', '#4a2c0a');
}

/* =========================================================
   PHARAOH QUEST — loop utama
   ========================================================= */
(function(){
  var last = performance.now(), acc = 0, STEP = 1000 / 60;

  function step(){
    if (G.screen === 'play') updatePlay();
    else { G.t++; updateMenus(); }
    if ((G.screen === 'over' || G.screen === 'complete') && !G.submitted){
      G.submitted = true;
      NET.submit(G.score);
    }
  }

  function render(){
    if (G.screen === 'title')        renderTitle();
    else if (G.screen === 'intro')  renderIntro();
    else if (G.screen === 'play'){   renderWorld(); renderHUD(); renderPlayOverlays(); }
    else if (G.screen === 'over')    renderOver();
    else                             renderComplete();
  }

  function loop(now){
    requestAnimationFrame(loop);
    acc += Math.min(120, now - last);
    last = now;
    var n = 0;
    while (acc >= STEP && n < 4){ step(); acc -= STEP; n++; }
    if (n === 4) acc = 0;
    render();
  }
  requestAnimationFrame(loop);
  window.__pq = { step: step, render: render };
})();

</script>
